<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SADA – Acompanhamento do Desempenho Acadêmico</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand navbar-dark bg-primary mb-4">
  <div class="container">
    <span class="navbar-brand">SADA</span>
    {% if user.is_authenticated %}
    <div class="navbar-nav me-auto">
      <a class="nav-link" href="{% url 'painel' %}">Painel</a>
      <a class="nav-link" href="{% url 'consulta' %}">Consulta</a>
      {% for g in user.groups.all %}{% if g.name == "Coordenador" %}<a class="nav-link" href="{% url 'divergencias' %}">Qualidade dos dados</a>{% endif %}{% endfor %}
    </div>
    <form method="post" action="{% url 'logout' %}" class="d-flex">
      {% csrf_token %}
      <span class="navbar-text me-3">{{ user.get_username }}</span>
      <button class="btn btn-sm btn-outline-light">Sair</button>
    </form>
    {% endif %}
  </div>
</nav>
<main class="container pb-5">
  {% block conteudo %}{% endblock %}
</main>
</body>
</html>
